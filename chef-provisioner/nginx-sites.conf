# Atlas Chef sites — static origin for generated apps (fork 3b.2/deploy target).
#
# Mounted at /etc/nginx/templates/default.conf.template in the chef-sites
# service (the docker-entrypoint envsubts *.template into conf.d). One nginx
# instance serves every deployed generated app from /srv/sites
# (chef-provisioner extracts the uploaded zips there). Routing:
#
#   /sites/<slug>/...  -> /srv/sites/<slug>/...   (explicit, always works)
#   /<path>            -> /srv/sites/$default_site/<path>
#                         ($default_site = CHEF_DEFAULT_SITE_SLUG env, substituted
#                          at container start; empty => plain 404 at the root)
#
# SPA fallback: extension-less paths under a site serve that site's
# index.html so client-routed apps work. Directory requests get a trailing-
# slash 301. Slugs are validated ([a-z0-9-]+) by the provisioner; nginx
# additionally rejects encoded path traversal.
server {
    listen 8080;
    server_name _;

    # never follow symlinks out of the sites root
    disable_symlinks if_not_owner from=/srv/sites;

    # ── explicit per-site routes ────────────────────────────────────────────
    # alias + index handles directory/index resolution; unknown URIs fall
    # through to the SPA fallback via error_page.
    location ~* ^/sites/(?<site>[a-z0-9][a-z0-9-]*)(?<rest>/.+)$ {
        alias /srv/sites/$site$rest;
        index index.html;
        error_page 404 = @spa_;
        add_header X-Chef-Site $site;
    }

    # exactly /sites/<slug> (no trailing slash) -> redirect into the dir
    location ~* ^/sites/(?<site>[a-z0-9][a-z0-9-]*)$ {
        return 301 /sites/$site/;
    }

    # exactly /sites/<slug>/ (trailing slash, empty rest) -> dir index
    location ~* ^/sites/(?<site>[a-z0-9][a-z0-9-]*)/$ {
        alias /srv/sites/$site/;
        index index.html;
        error_page 404 = @spa_;
        add_header X-Chef-Site $site;
    }

    # SPA fallback: rewrite to the site's index.html using the $site captured
    # by the location that hit error_page ($site persists into the named
    # location). rewrite …last keeps the browser URL intact.
    location @spa_ {
        internal;
        rewrite ^ /sites/$site/index.html last;
    }

    # ── default site at the root ────────────────────────────────────────────
    # CHEF_DEFAULT_SITE_SLUG is substituted by the docker-entrypoint
    # (envsubst on the *.template). Empty => root 404s.
    set $default_site "${CHEF_DEFAULT_SITE_SLUG}";
    location / {
        try_files /$default_site$uri /$default_site$uri/index.html /$default_site$uri/ =404;
    }

    # ── caching ─────────────────────────────────────────────────────────────
    location ~* ^/sites/.+\.(js|css|woff2?|png|jpe?g|gif|svg|ico|webp|map)$ {
        alias /srv/sites/$uri;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Chef-Site-Asset 1;
    }

    # ── hardening ───────────────────────────────────────────────────────────
    # path traversal: nginx normalizes ../ before location matching, so a
    # surviving encoded sequence is always malicious — reject it.
    if ($request_uri ~ "%2e%2e") {
        return 400;
    }
}
