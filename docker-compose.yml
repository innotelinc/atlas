# ==========================================================================
# Atlas — operator compose for the coding & development platform.
#
# Default services (docker compose up -d): Gitea (repo & development
# hosting) and the self-hosted Convex backend + dashboard (the reactive
# backend apps deploy onto). One stack, no profiles:
#
#   docker compose up -d                       # Gitea + Convex + dashboard
#
# The `chef` profile is gone — Chef is retired as a builder (see the note
# where it used to live, further down, and the convergence plan §2/§8).
# ==========================================================================

name: atlas

services:
  # ------------------------------------------------------------------
  # Gitea — repo & development hosting. Built-in wiki, issue boards,
  # package registry, and Actions CI. SSO via Authentik (Cerulean).
  # ------------------------------------------------------------------
  gitea:
    # Memory posture (docs/service-audit.md): git server with Actions CI;
    # cap moderately (measured steady well under 1 GiB).
    mem_limit: 2g
    memswap_limit: 2g
    image: gitea/gitea:${GITEA_VERSION:-1.27.2}
    container_name: atlas-gitea
    restart: unless-stopped
    environment:
      GITEA__server__DOMAIN: ${GIT_HOST:-git.innotel.us}
      GITEA__server__SSH_DOMAIN: ${GIT_HOST:-git.innotel.us}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-https://git.innotel.us/}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-22}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-change-me-gitea-db-password}
      # No open signups: accounts come from Authentik SSO or the admin.
      GITEA__service__DISABLE_REGISTRATION: ${GITEA_DISABLE_REGISTRATION:-true}
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__session__COOKIE_SECURE: "true"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-22}:22"
    volumes:
      - gitea-data:/data
    depends_on:
      gitea-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6

  gitea-db:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: atlas-gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:-change-me-gitea-db-password}
    volumes:
      - gitea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GITEA_DB_USER:-gitea} -d ${GITEA_DB_NAME:-gitea}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ------------------------------------------------------------------
  # Convex backend — self-hosted reactive database & compute, and a deploy
  # target for apps the builder produces (convergence §2: Atlas keeps CodeOps,
  # and Convex with it, while the *building* happens in Olympus). SQLite
  # storage on a named volume by default.
  # Publish ports to 127.0.0.1; the edge (NPM) fronts them publicly and
  # Cerulean attaches TLS. See docs/Deployment.md for Postgres/S3 options.
  # ------------------------------------------------------------------
  convex:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_VERSION:-latest}
    container_name: atlas-convex
    stop_grace_period: 10s
    stop_signal: SIGINT
    restart: unless-stopped
    ports:
      - "${CONVEX_BACKEND_PORT:-3210}:3210"
      - "${CONVEX_SITE_PORT:-3211}:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-atlas-convex}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:-}
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:${CONVEX_BACKEND_PORT:-3210}
      CONVEX_SITE_ORIGIN: http://127.0.0.1:${CONVEX_SITE_PORT:-3211}
      DO_NOT_REQUIRE_SSL: "1"
      DISABLE_BEACON: "1"
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ------------------------------------------------------------------
  # Convex dashboard — admin UI for the self-hosted backend.
  # Generate admin keys with `make convex-key`.
  # ------------------------------------------------------------------
  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_VERSION:-latest}
    container_name: atlas-convex-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:${CONVEX_BACKEND_PORT:-3210}
      NEXT_PUBLIC_LOAD_MONACO_INTERNALLY: ${NEXT_PUBLIC_LOAD_MONACO_INTERNALLY:-false}
    depends_on:
      convex:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Chef — RETIRED AS A BUILDER (build-plane convergence plan §2/§8).
  #
  # It used to be here as a `chef` profile (chef + chef-provisioner +
  # chef-sites), building apps onto this stack's Convex backend. The plan
  # settled on *one* builder — Olympus's engine (project_plan → runner →
  # package-app/website → app-runtime) — because it is the only one of the
  # three that ends with a running, named application. Two app-builder front
  # doors were two ways to do one job, and Chef's output was bound to Convex.
  #
  # Nothing was deleted from the tree: `chef-provisioner/` and
  # docs/chef-auth-fork.md stay as the record of that work (their headers say
  # so). What changed is that Atlas no longer *runs* a builder, and the
  # profile cannot be brought up from this file.
  #
  # What Atlas keeps from it is Convex. It stays a first-class deploy target
  # for apps the builder produces — a realtime backend is a real product that
  # the container runtime does not replace. Wiring it as a target the plan may
  # pick lives in Studio (see the convergence doc §10.3 for the open question
  # on when the Convex packaging path lands).
  #
  # Re-adding it is a decision, not an oversight: the services are in git
  # history at the commit before this comment.
  # ------------------------------------------------------------------

volumes:
  gitea-data:
  gitea-db-data:
  convex-data:
