name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Policy · Structure · Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit message policy
        run: bash scripts/check-commit-messages.sh

      - name: Repository structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/stack.md
          test -f .env.example
          test -f web/landing/index.html
          echo "structure: ok"

      - name: Validate compose
        run: |
          docker compose config --quiet
          # The `chef` profile is retired (convergence plan §2/§8): Atlas runs no
          # builder. Assert it stays gone, so a stale service cannot reappear in
          # a file whose whole point is that the stack has one builder.
          if docker compose config --profile chef 2>/dev/null | grep -q 'atlas-chef'; then
            echo "::error::the retired chef profile is back in docker-compose.yml"
            exit 1
          fi
          echo "compose: ok"

      - name: Landing page sanity
        run: |
          grep -qi "Atlas" web/landing/index.html
          echo "landing: ok"
